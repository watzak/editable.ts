<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>editable.ts — y-indexeddb offline demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="dist/styles.js"></script>
    <style>
      .demo {
        max-width: 820px;
        margin: 1.5rem auto;
        font-family: system-ui, sans-serif;
      }
      .banner {
        background: #fef3c7;
        border: 1px solid #fcd34d;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font-size: 0.85rem;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      .toolbar button {
        padding: 0.35rem 0.65rem;
        border: 1px solid #bbb;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      [contenteditable] {
        min-height: 8rem;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      .log {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <section class="demo" data-testid="yjs-offline-demo">
      <h1>y-indexeddb + y-websocket offline demo</h1>
      <p class="banner">
        IndexedDB hydrates locally first; websocket syncs when online. Both providers are optional
        devDependencies — not part of editable.ts core.
      </p>
      <div class="toolbar">
        <button type="button" data-action="toggle-offline">Toggle offline</button>
        <button type="button" data-action="reconnect">Force reconnect</button>
      </div>
      <div class="status-pill" data-testid="provider-status" data-state="connecting">
        connecting
      </div>
      <div id="editor" contenteditable="true" data-plaintext="true"></div>
      <pre class="log" data-testid="diagnostic-log"></pre>
    </section>
    <script type="module" src="yjs-offline-demo.js"></script>
  </body>
</html>
