<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>editable.ts — Yjs document collab demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="dist/styles.js"></script>
    <style>
      .doc-demo {
        max-width: 960px;
        margin: 1.5rem auto;
        font-family: system-ui, sans-serif;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      .toolbar button {
        padding: 0.35rem 0.65rem;
        border: 1px solid #bbb;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .cms-document {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
        background: #fafafa;
        min-height: 12rem;
      }
      .cms-component {
        margin: 0.75rem 0;
      }
      .cms-two-column-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .cms-column {
        border: 1px dashed #ccc;
        padding: 0.5rem;
        min-height: 4rem;
      }
      .cms-quote-title {
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      [contenteditable] {
        min-height: 2rem;
        padding: 0.35rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fff;
      }
      .status {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        white-space: pre-wrap;
      }
      .banner {
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <section class="doc-demo" data-testid="yjs-document-collab-demo">
      <h1>Yjs document binding — experimental demo</h1>
      <p class="banner">
        Example CMS schema (<code>paragraph</code>, <code>heading</code>, <code>quote</code>,
        <code>two-column</code>). Adapter rendering only — not part of the core library.
      </p>
      <div class="toolbar">
        <button type="button" data-action="insert-paragraph">+ Paragraph</button>
        <button type="button" data-action="insert-heading">+ Heading</button>
        <button type="button" data-action="insert-quote">+ Quote</button>
        <button type="button" data-action="insert-columns">+ Two columns</button>
        <button type="button" data-action="split">Split</button>
        <button type="button" data-action="merge">Merge with previous</button>
        <button type="button" data-action="delete">Delete component</button>
        <button type="button" data-action="undo">Undo</button>
        <button type="button" data-action="redo">Redo</button>
        <button type="button" data-action="destroy-remount">Destroy &amp; remount</button>
      </div>
      <div class="cms-document" id="cms-document"></div>
      <pre class="status" data-testid="doc-collab-status">booting…</pre>
    </section>
    <script type="module" src="yjs-document-collab-demo.js"></script>
  </body>
</html>
