<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>editable.ts — Yjs document collab demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="dist/styles.js"></script>
    <style>
      .doc-demo {
        max-width: 1100px;
        margin: 1.5rem auto;
        font-family: system-ui, sans-serif;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      .toolbar button {
        padding: 0.35rem 0.65rem;
        border: 1px solid #bbb;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .clients {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .client {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 0.75rem;
        background: #fafafa;
      }
      .client h2 {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        text-transform: uppercase;
        color: #666;
      }
      .cms-document {
        min-height: 10rem;
      }
      .cms-component {
        margin: 0.5rem 0;
      }
      .cms-two-column-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      .cms-column {
        border: 1px dashed #ccc;
        padding: 0.35rem;
        min-height: 3rem;
      }
      [contenteditable] {
        min-height: 2rem;
        padding: 0.35rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        background: #fff;
      }
      .status {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        white-space: pre-wrap;
      }
      .banner {
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <section class="doc-demo" data-testid="yjs-document-collab-demo">
      <h1>Yjs document binding — two-client demo</h1>
      <p class="banner">
        Transport via <code>Y.applyUpdate</code> / state vectors (manual network simulation). Not a
        production provider.
      </p>
      <div class="toolbar">
        <button type="button" data-action="insert-a">A: + Paragraph</button>
        <button type="button" data-action="insert-b">B: + Quote</button>
        <button type="button" data-action="insert-two-column-a">A: + Two-column</button>
        <button type="button" data-action="move-a">A: move first to end</button>
        <button type="button" data-action="move-nested-a">A: move paragraph → left col</button>
        <button type="button" data-action="delete-a">A: delete focused</button>
        <button type="button" data-action="offline-a">A offline</button>
        <button type="button" data-action="offline-b">B offline</button>
        <button type="button" data-action="reconnect">Reconnect</button>
        <button type="button" data-action="undo-a">A undo</button>
        <button type="button" data-action="destroy-a">A destroy</button>
      </div>
      <div class="clients">
        <div class="client" data-client="a">
          <h2>Client A</h2>
          <div class="cms-document" id="cms-document-a"></div>
        </div>
        <div class="client" data-client="b">
          <h2>Client B</h2>
          <div class="cms-document" id="cms-document-b"></div>
        </div>
      </div>
      <pre class="status" data-testid="doc-collab-status">booting…</pre>
    </section>
    <script type="module" src="yjs-document-collab-demo.js"></script>
  </body>
</html>
