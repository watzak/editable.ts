<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>editable.ts — y-websocket integration demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="dist/styles.js"></script>
    <style>
      .demo {
        max-width: 820px;
        margin: 1.5rem auto;
        font-family: system-ui, sans-serif;
      }
      .banner {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        font-size: 0.85rem;
      }
      .status-bar {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin: 1rem 0;
        font-size: 0.85rem;
      }
      .status-pill {
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
      }
      .status-pill[data-state='synced'] {
        background: #dcfce7;
        border-color: #86efac;
      }
      .status-pill[data-state='error'],
      .status-pill[data-state='disconnected'] {
        background: #fee2e2;
        border-color: #fca5a5;
      }
      [contenteditable] {
        min-height: 8rem;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
      }
      .log {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        white-space: pre-wrap;
        max-height: 8rem;
        overflow: auto;
        background: #0f172a;
        color: #e2e8f0;
        padding: 0.5rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <section class="demo" data-testid="yjs-websocket-demo">
      <h1>y-websocket integration</h1>
      <p class="banner">
        Requires <code>node scripts/yjs-websocket-server.mjs</code>. Provider is integrator-owned —
        not bundled in editable.ts.
      </p>
      <div class="status-bar">
        <span>Provider:</span>
        <span class="status-pill" data-testid="provider-status" data-state="disconnected"
          >disconnected</span
        >
        <span>Room:</span>
        <code id="room-name">editable-demo</code>
      </div>
      <div
        id="editor"
        contenteditable="true"
        data-plaintext="false"
        data-testid="websocket-editor"
      ></div>
      <pre class="log" data-testid="diagnostic-log">waiting for provider…</pre>
    </section>
    <script type="module" src="yjs-websocket-demo.js"></script>
  </body>
</html>
